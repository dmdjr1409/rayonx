[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rayonx"
version = "0.3.0"
description = "Fast, zero-dependency CLI to audit and clean AI-generated code slop and trivial comments."
readme = "README.md"
authors = [
    { name = "Junior Diomande", email = "diomandejunior14@hotmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["code-quality", "linter", "ai-cleaner", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
rayonx = "rayonx.cli:main"

[project.urls]
Homepage = "https://github.com/dmdjr1409/rayonx"
Repository = "https://github.com/dmdjr1409/rayonx"
Issues = "https://github.com/dmdjr1409/rayonx/issues"
